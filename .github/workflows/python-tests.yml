name: Python Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      FINWHIZ_TEST_MODE: "1"
      GCS_BUCKET: dummy-bucket
      BUCKET_CREDENTIALS: tests/fake-creds.json
      VERTEXAI_CREDENTIALS: tests/fake-creds.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Create fake credentials
        run: |
          mkdir -p tests
          echo '{}' > tests/fake-creds.json

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-cov pytest-asyncio
          uv pip install --system -e src/llm -e src/embedder -e src/agentic_user_data_processing -e src/query_client -e src/webscraping

      - name: Run service unit tests
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          rm -f .coverage.unit
          coverage run -m pytest \
            src/llm/tests \
            src/embedder/tests \
            src/agentic_user_data_processing/tests \
            src/query_client/tests \
            src/webscraping/tests
          coverage report

      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    env:
      FINWHIZ_TEST_MODE: "1"
      GCS_BUCKET: dummy-bucket
      BUCKET_CREDENTIALS: tests/fake-creds.json
      VERTEXAI_CREDENTIALS: tests/fake-creds.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Create fake credentials
        run: |
          mkdir -p tests
          echo '{}' > tests/fake-creds.json

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-cov pytest-asyncio
          uv pip install --system -e src/llm -e src/embedder -e src/agentic_user_data_processing -e src/query_client -e src/webscraping

      - name: Run integration tests
        env:
          COVERAGE_FILE: .coverage.integration
        run: |
          rm -f .coverage.integration
          coverage run -m pytest tests/integration
          coverage report

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration

  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage tooling
        run: pip install coverage

      - name: Download unit coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage_artifacts/unit

      - name: Download integration coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage_artifacts/integration

      - name: Combine coverage and report
        run: |
          coverage combine coverage_artifacts/unit/.coverage.unit coverage_artifacts/integration/.coverage.integration
          coverage report
          coverage xml -o coverage.xml

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: coverage.xml
