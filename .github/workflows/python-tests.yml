name: Python Tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      FINWHIZ_TEST_MODE: "1"
      GCS_BUCKET: dummy-bucket
      BUCKET_CREDENTIALS: tests/fake-creds.json
      VERTEXAI_CREDENTIALS: tests/fake-creds.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Create fake credentials
        run: |
          mkdir -p tests
          echo '{}' > tests/fake-creds.json

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-cov pytest-asyncio
          uv pip install --system -e src/llm -e src/embedder -e src/agentic_user_data_processing -e src/query_client -e src/webscraping

      - name: Run service unit tests
        run: |
          pytest \
            src/llm/tests \
            src/embedder/tests \
            src/agentic_user_data_processing/tests \
            src/query_client/tests \
            src/webscraping/tests

  integration:
    runs-on: ubuntu-latest
    needs: unit
    env:
      FINWHIZ_TEST_MODE: "1"
      GCS_BUCKET: dummy-bucket
      BUCKET_CREDENTIALS: tests/fake-creds.json
      VERTEXAI_CREDENTIALS: tests/fake-creds.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Create fake credentials
        run: |
          mkdir -p tests
          echo '{}' > tests/fake-creds.json

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-cov pytest-asyncio
          uv pip install --system -e src/llm -e src/embedder -e src/agentic_user_data_processing -e src/query_client -e src/webscraping

      - name: Run integration tests
        run: pytest tests/integration

      - name: Determine cloud secret availability
        run: |
          echo "HAS_CLOUD_SECRETS=${{ secrets.VERTEXAI_SERVICE_ACCOUNT_JSON != '' && secrets.CLOUDSQL_PASSWORD != '' && secrets.CLOUDSQL_PROXY_JSON != '' }}" >> $GITHUB_ENV


      - name: Load deployment env values
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          python - <<'PY'
          import os

          env_path = ".env"
          vals = {}
          if os.path.exists(env_path):
              with open(env_path) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      vals[key.strip()] = value.strip()

          bucket = vals.get("GCS_BUCKET", "finwhiz-storage")
          with open(os.environ["GITHUB_ENV"], "a") as envfile:
              envfile.write(f"GCS_BUCKET={bucket}\n")
              envfile.write("REAL_FIXTURE_BUCKET=finwhiz-storage\n")
              envfile.write("REAL_FIXTURE_PREFIX=cloud_testing\n")
          PY

      - name: Skip cloud tests when missing secrets
        if: env.HAS_CLOUD_SECRETS == 'false'
        run: |
          echo "Skipping cloud-backed tests: secrets not configured."

      - name: Write Vertex credentials
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          echo '${{ secrets.VERTEXAI_SERVICE_ACCOUNT_JSON }}' > /tmp/vertexai.json

      - name: Write Cloud SQL password
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          echo '${{ secrets.CLOUDSQL_PASSWORD }}' > /tmp/sql_password.txt

      - name: Write Cloud SQL proxy credentials
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          echo '${{ secrets.CLOUDSQL_PROXY_JSON }}' > /tmp/cloudsql-proxy.json

      - name: Install system dependencies for cloud tests
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: sudo apt-get update && sudo apt-get install -y ghostscript netcat-openbsd

      - name: Download Cloud SQL Proxy
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          curl -sSL https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.3/cloud-sql-proxy.linux.amd64 -o cloud-sql-proxy
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Proxy
        if: env.HAS_CLOUD_SECRETS == 'true'
        env:
          CLOUDSQL_INSTANCE: finwhiz-ac215:us-central1:finwhiz-cloud-sql
        run: |
          ./cloud-sql-proxy $CLOUDSQL_INSTANCE --credentials-file=/tmp/cloudsql-proxy.json --port 5432 &
          echo $! > /tmp/cloud_sql_proxy_pid

      - name: Wait for Cloud SQL Proxy
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          for i in {1..15}; do nc -z localhost 5432 && exit 0; sleep 2; done
          echo "Cloud SQL proxy did not start" >&2
          exit 1

      - name: Install agent package for cloud tests
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          uv pip install --system -e src/agentic_user_data_processing

      - name: Download real fixture PDFs
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google.cloud import storage

          bucket_name = os.environ.get("REAL_FIXTURE_BUCKET") or os.environ.get("GCS_BUCKET")
          prefix = os.environ.get("REAL_FIXTURE_PREFIX", "cloud_testing").rstrip("/")
          if not bucket_name:
              raise SystemExit("REAL_FIXTURE_BUCKET or GCS_BUCKET must be set for cloud fixtures")

          out_dir = Path("tests/cloud_fixtures")
          out_dir.mkdir(parents=True, exist_ok=True)

          files = {
              f"{prefix}/w2_000.pdf": out_dir / "w2_000.pdf",
              f"{prefix}/1099int_001.pdf": out_dir / "1099int_001.pdf",
              f"{prefix}/portfolio_001.pdf": out_dir / "portfolio_001.pdf",
          }

          client = storage.Client.from_service_account_json("/tmp/vertexai.json")
          bucket = client.bucket(bucket_name)
          for blob_name, destination in files.items():
              blob = bucket.blob(blob_name)
              blob.download_to_filename(destination)
              print(f"Downloaded {blob_name} -> {destination}")

          with open(os.environ["GITHUB_ENV"], "a") as envfile:
              envfile.write(f"REAL_FIXTURE_DIR={out_dir}\n")
          PY

      - name: Run cloud-backed tests
        if: env.HAS_CLOUD_SECRETS == 'true'
        env:
          VERTEXAI_CREDENTIALS: /tmp/vertexai.json
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/vertexai.json
          BUCKET_CREDENTIALS: /tmp/vertexai.json
          GOOGLE_CLOUD_PROJECT: finwhiz-ac215
          GCP_PROJECT: finwhiz-ac215
          VERTEXAI_PROJECT: finwhiz-ac215
          VERTEXAI_LOCATION: us-central1
          DB_PASS: /tmp/sql_password.txt
          DB_USER: postgres
          DB_NAME: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: pytest tests/cloud

      - name: Stop Cloud SQL Proxy
        if: ${{ always() && env.HAS_CLOUD_SECRETS == 'true' }}
        run: |
          if [ -f /tmp/cloud_sql_proxy_pid ]; then
            kill "$(cat /tmp/cloud_sql_proxy_pid)" || true
          fi

  system:
    runs-on: ubuntu-latest
    needs: integration
    env:
      RUN_SYSTEM_TESTS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine system secret availability
        run: |
          echo "HAS_SYSTEM_SECRET=${{ secrets.VERTEXAI_SERVICE_ACCOUNT_JSON != '' && secrets.CLOUDSQL_PASSWORD != '' && secrets.CLOUDSQL_PROXY_JSON != '' }}" >> $GITHUB_ENV

      - name: Skip system tests without secrets
        if: env.HAS_SYSTEM_SECRET == 'false'
        run: echo "Skipping system tests -- secrets not configured."

      - name: Set up Python
        if: env.HAS_SYSTEM_SECRET == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: env.HAS_SYSTEM_SECRET == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Prepare secrets for services
        if: env.HAS_SYSTEM_SECRET == 'true'
        run: |
          mkdir -p secrets
          echo '${{ secrets.VERTEXAI_SERVICE_ACCOUNT_JSON }}' > secrets/service-account-key.json
          cp secrets/service-account-key.json secrets/vertexai-service-account.json
          echo '${{ secrets.CLOUDSQL_PASSWORD }}' > secrets/sql_password.txt
          echo '${{ secrets.CLOUDSQL_PROXY_JSON }}' > secrets/proxy-key.json

      - name: Configure Artifact Registry auth
        if: env.HAS_SYSTEM_SECRET == 'true'
        env:
          AR_KEY: ${{ secrets.VERTEXAI_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$AR_KEY" > /tmp/ar-creds.json
          gcloud auth activate-service-account --key-file=/tmp/ar-creds.json
          gcloud --quiet auth configure-docker us-central1-docker.pkg.dev

      - name: Check image sizes before pulling
        if: env.HAS_SYSTEM_SECRET == 'true'
        id: image-guard
        run: |
          set -e
          REPO="us-central1-docker.pkg.dev/finwhiz-ac215/finwhiz-img/finwhiz"
          MAX_BYTES=$((6 * 1024 * 1024 * 1024))  # 6 GiB guardrail
          OVER=0
          for TAG in cloudsql-proxy agent llm; do
            SIZE=$(gcloud artifacts docker images describe "$REPO:$TAG" --format="get(image_summary.total_size_bytes)" || echo 0)
            echo "Image $TAG size: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_BYTES" ]; then
              echo "::warning::Image $TAG exceeds ${MAX_BYTES} bytes; skipping system tests."
              OVER=1
            fi
          done
          if [ "$OVER" -eq 1 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Start docker-compose stack
        if: env.HAS_SYSTEM_SECRET == 'true' && steps.image-guard.outputs.skip != 'true'
        id: compose-up
        run: |
          set +e
          docker compose up -d cloudsql-proxy llm agent |& tee /tmp/system_docker.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qiE "no space left on device|no matching manifest|denied: Unauthenticated request" /tmp/system_docker.log; then
              echo "Docker compose failed due to infrastructure limits. Skipping system tests."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "docker compose up failed; see log below."
            cat /tmp/system_docker.log
            exit "$status"
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Wait for services
        if: env.HAS_SYSTEM_SECRET == 'true' && steps.image-guard.outputs.skip != 'true' && steps.compose-up.outputs.skip != 'true'
        run: |
          for i in {1..40}; do
            if curl -sSf http://localhost:8010/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Agent service failed to become healthy" >&2
          docker compose ps
          exit 1

      - name: Run system tests
        if: env.HAS_SYSTEM_SECRET == 'true' && steps.image-guard.outputs.skip != 'true' && steps.compose-up.outputs.skip != 'true'
        env:
          RUN_SYSTEM_TESTS: "1"
        run: pytest tests/system

      - name: Teardown docker-compose stack
        if: ${{ always() && env.HAS_SYSTEM_SECRET == 'true' && steps.image-guard.outputs.skip != 'true' && steps.compose-up.outputs.skip != 'true' }}
        run: docker compose down
