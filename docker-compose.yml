version: "3.9"

services:
  llm:
    build:
      context: ./src/llm
      dockerfile: Dockerfile
    image: finwhiz_llm
    container_name: finwhiz_llm
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - GOOGLE_APPLICATION_CREDENTIALS=${BUCKET_CREDENTIALS}
      - VERTEXAI_CREDENTIALS=${VERTEXAI_CREDENTIALS}
    depends_on:
      - postgres
    volumes:
      - .:/app
      - ./secrets/service-account-key.json:/app/secrets/service-account-key.json:ro
      - ./secrets/vertexai-service-account.json:/app/secrets/vertexai-service-account.json:ro
    restart: unless-stopped
    networks:
      - finwhiz_network

  agent:
    build:
      context: ./src/agentic_user_data_processing
      dockerfile: Dockerfile
    image: finwhiz_agent
    container_name: finwhiz_agent
    volumes:
      - .:/app
      - ./secrets/service-account-key.json:/app/secrets/service-account-key.json:ro
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/src
      - DATABASE_URL=${DATABASE_URL}
      - USER_UPLOAD_BUCKET=${USER_UPLOAD_BUCKET}
      - GOOGLE_APPLICATION_CREDENTIALS=${BUCKET_CREDENTIALS}
    depends_on:
      - llm 
      - postgres
    restart: unless-stopped
    networks:
      - finwhiz_network

  query_client:
    build:
      context: ./src/query_client
      dockerfile: Dockerfile
    image: finwhiz_query
    container_name: finwhiz_query
    depends_on:
      - llm
      - agent
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LLM_URL=http://llm:8001/query
      - AGENT_URL=http://agent:8010
    command: /bin/bash -c "sleep 8 && python src/query_client/interactive_query.py"
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    networks:
      - finwhiz_network
    restart: on-failure

  postgres:
    image: postgres:16
    container_name: finwhiz_postgres
    environment:
      POSTGRES_USER: finwhiz
      POSTGRES_PASSWORD: finwhiz
      POSTGRES_DB: finwhiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finwhiz_network
    restart: unless-stopped

networks:
  finwhiz_network:
    driver: bridge

volumes:
  chroma_data:
  postgres_data: