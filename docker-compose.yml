services:
  llm:
    build:
      context: ./src/llm
      dockerfile: Dockerfile
    image: finwhiz_llm
    container_name: finwhiz_llm
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - finwhiz_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  agent:
    build:
      context: ./src/agentic_user_data_processing
      dockerfile: Dockerfile
    image: finwhiz_agent
    container_name: finwhiz_agent
    volumes:
      - .:/app
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/src
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      llm:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped
    networks:
      - finwhiz_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
  query_client:
    build:
      context: ./src/query_client
      dockerfile: Dockerfile
    image: finwhiz_query
    container_name: finwhiz_query
    depends_on:
      llm:
        condition: service_healthy
      agent:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    stdin_open: true    # allows interactive input
    tty: true           # keeps container running interactively
    networks:
      - finwhiz_network
    
  postgres:
    image: postgres:16
    container_name: finwhiz_postgres
    environment:
      POSTGRES_USER: finwhiz
      POSTGRES_PASSWORD: finwhiz
      POSTGRES_DB: finwhiz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finwhiz_network
    restart: unless-stopped

networks:
  finwhiz_network:
    driver: bridge
volumes:
  chroma_data:
  postgres_data:
