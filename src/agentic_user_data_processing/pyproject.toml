[project]
name = "agentic-user-data-processing"
version = "0.1.0"
description = "Agent microservice for chat history and document ingestion."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.1",
    "python-dotenv>=1.0.1",
    "langchain-google-vertexai>=2.1.2",
    "google-cloud-storage>=2.18.0",
    "pydantic>=2.12.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.9",
    "pdfminer-six>=20231228",
    "pypdf2>=3.0.1",
    "psycopg2-binary>=2.9.11",
    "black>=24.10.0",
    "flake8>=7.1.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "yfinance>=0.2.40",
]

[tool.uv]
package = true

[tool.black]
line-length = 160
target-version = ["py312"]

[tool.flake8]
max-line-length = 160
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
