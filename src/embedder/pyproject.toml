[project]
name = "finwhiz-embedder"
version = "0.1.0"
description = "This is the container for the machine learning pipeline portion of the project"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.1.1",
    "einops>=0.8.1",
    "google-cloud-storage>=3.4.0",
    "sentence-transformers>=5.1.1",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "black>=24.10.0",
    "flake8>=7.1.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.black]
line-length = 160
target-version = ["py312"]

[tool.flake8]
max-line-length = 160
extend-ignore = ["E203", "W503"]
