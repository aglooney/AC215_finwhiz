[project]
name = "finwhiz-gcp-storage"
version = "0.1.0"
description = "GCS helper utilities for FinWhiz"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=2.19.0",
    "python-dotenv>=1.1.1",
    "black>=24.10.0",
    "flake8>=7.1.1",
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
]

[tool.black]
line-length = 160
target-version = ["py312"]

[tool.flake8]
max-line-length = 160
extend-ignore = ["E203", "W503"]
