[project]
name = "synthetic-financial-docs"
version = "0.1.0"
description = "Containerized synthetic financial document generator for FinWhiz (W-2, 1099, Portfolio)"
requires-python = ">=3.12"
dependencies = [
    "faker>=30.6.0",
    "numpy>=2.1.2",
    "pandas>=2.2.3",
    "pypdf>=5.1.0",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "typer>=0.12.5",
    "reportlab>=4.0.0",
    "rich>=13.0.0",
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
]
