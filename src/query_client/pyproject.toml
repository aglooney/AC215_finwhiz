[project]
name = "app"
version = "0.1.0"
description = "This is the container for the machine learning pipeline portion of the project"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
    "black>=24.10.0",
    "flake8>=7.1.1",
]

[tool.black]
line-length = 160
target-version = ["py312"]

[tool.flake8]
max-line-length = 160
extend-ignore = ["E203", "W503"]
